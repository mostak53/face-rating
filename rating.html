<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Faces - Golden Ratio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="rating-body">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-face-smile"></i>
                FaceRatio
            </div>
            <div class="user-info">
                <span id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <div class="rating-container">
        <div class="stats-header">
            <h1>Rate Faces</h1>
            <div class="user-stats">
                <span>Ratings: <span id="totalRatings">0</span></span>
                | 
                <span>Photos Left: <span id="photosLeft">0</span></span>
            </div>
        </div>

        <div id="photosGrid" class="photos-grid rating-grid"></div>
        <div id="completeMessage" class="complete-message" style="display:none;">
            <h2>🎉 Great Job!</h2>
            <p>You've rated all available photos!</p>
            <a href="index.html" class="cta-button">Back to Home</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="rating.js"></script>
</body>
</html>
