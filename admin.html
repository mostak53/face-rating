<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Face Rating System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="admin-body">
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-user-shield"></i>
                Admin Panel
            </div>
            <a href="index.html" class="nav-link">← Back to Site</a>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-panel">
            <h1>Admin Dashboard</h1>
            
            <!-- Stats -->
            <div class="admin-stats">
                <div class="stat-card">
                    <i class="fas fa-images"></i>
                    <h3 id="totalPhotos">0</h3>
                    <p>Total Photos</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-users"></i>
                    <h3 id="totalUsers">0</h3>
                    <p>Total Users</p>
                </div>
                <div class="stat-card">
                    <i class="fas fa-star"></i>
                    <h3 id="totalRatings">0</h3>
                    <p>Total Ratings</p>
                </div>
            </div>

            <!-- Actions -->
            <div class="admin-actions">
                <div class="action-card">
                    <h3><i class="fas fa-upload"></i> Upload Photo</h3>
                    <form id="uploadForm" enctype="multipart/form-data">
                        <input type="text" id="photoName" placeholder="Photo name (e.g., Celebrity 1 - Front)" required>
                        <input type="file" id="photoFile" accept="image/*" required>
                        <select id="celebritySelect">
                            <option value="">Select Celebrity</option>
                            <option value="celebrity1">Celebrity 1</option>
                            <option value="celebrity2">Celebrity 2</option>
                            <option value="celebrity3">Celebrity 3</option>
                            <option value="new">New Celebrity</option>
                        </select>
                        <input type="text" id="newCelebrity" placeholder="New celebrity name" style="display:none;">
                        <button type="submit">Upload Photo</button>
                    </form>
                </div>

                <div class="action-card">
                    <h3><i class="fas fa-download"></i> Export Data</h3>
                    <button id="exportExcel">Download Excel Report</button>
                    <button id="exportUsers">Download Users Data</button>
                </div>
            </div>

            <!-- Photos Management -->
            <div class="photos-management">
                <h3><i class="fas fa-image"></i> Manage Photos</h3>
                <div id="photosGrid" class="photos-grid"></div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
